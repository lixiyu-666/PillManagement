server:
  port: 8080

spring:
  datasource:
    # SQLite 数据库路径（相对于项目根目录）
    url: jdbc:sqlite:${user.dir}/PillManagement.db?date_format=yyyy-MM-dd&datetime_format=yyyy-MM-dd HH:mm:ss
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1  # SQLite 只支持单连接

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.med.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 文件上传配置
file:
  upload-path: /data/uploads/

# 登录配置
auth:
  username: admin
  password: 123456
